<!doctype html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      .product-card {
        background-color: rgb(227, 255, 14);
        width: 80px;
        border-radius: 5px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
      const rootElement = document.querySelector(".js-container");

      // 1a: 显示一个带文字的按钮
      function GoodJobButton() {
        return <button>Good job!</button>;
      }

      // 1b: 显示自我介绍
      function MyName() {
        return <p>My name is yoyo</p>;
      }

      // 1c: 显示商品卡片
      function ProductCard() {
        return (
          <div className="product-card">
            <div>Cotton socks</div>
            <div> Price: $10</div>
          </div>
        );
      }

      // 1d: 计算商品总价并输出到控制台
      const socksCost = 10;
      const tshirtsCost = 2 * 8;
      const productCost = socksCost + tshirtsCost;
      console.log(productCost);

      // 1e: 在页面显示商品总价
      function ProductCost() {
        return <p>Product cost: ${productCost}</p>;
      }

      // 1f: 计算并显示运费与订单总价
      const shippingCost = 5;
      function ShippingCost() {
        return <p>Shipping cost: ${shippingCost}</p>;
      }

      function TotalCost() {
        return <p>Total cost: ${productCost + shippingCost}</p>;
      }

      // 1g / 1h / 1i: 获取当前日期和时间，并显示到页面
      function CurrentDateTime() {
        const todayDate = dayjs().format("MMMM D");
        const currentTime = dayjs().format("HH:mm:ss");

        return (
          <>
            <p>Today is {todayDate}</p>
            <p>Current time: {currentTime}</p>
          </>
        );
      }

      function renderPageContent() {
        return (
          <>
            <GoodJobButton />
            <MyName />
            <ProductCard />
            <ProductCost />
            <ShippingCost />
            <TotalCost />
            <CurrentDateTime />
          </>
        );
      }

      const root = ReactDOM.createRoot(rootElement);
      root.render(renderPageContent());

      setInterval(() => {
        root.render(renderPageContent());
      }, 1000);
    </script>
  </body>
</html>
